<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- GitHub Pages cannot send headers, so the policy is here. No inline script or style: the module
     and stylesheet are same-origin files, and any inline script added later must be listed by its
     sha256 hash (tests/security-hardening.mjs checks). The key only ever goes to the Worker hosts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src data:; connect-src https://riftborn-leaderboard.chanmanc10.workers.dev https://api.riftborn.us; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10141e">
<title>Riftborn · Feedback inbox</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161c42'/%3E%3Cpath d='m18 2-12 17h9l-2 11 13-18h-9z' fill='%238effd1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="inbox.css">
</head>
<body>
<header class="top">
  <h1>RIFT<span>BORN</span> <small>FEEDBACK INBOX</small></h1>
  <div class="top-actions">
    <b id="unread" class="unread" hidden></b>
    <button id="lock" type="button" class="ghost" hidden>LOCK</button>
  </div>
</header>

<main>
  <section id="login" class="panel login" hidden>
    <h2>ADMIN KEY</h2>
    <p class="hint">Enter the <code>FEEDBACK_ADMIN_KEY</code> secret you set for the leaderboard Worker (24+ random characters). It is kept for this tab only (closing the tab forgets it).</p>
    <form id="loginForm" autocomplete="off">
      <input id="keyInput" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" aria-label="Admin key" required>
      <button type="submit" class="primary">UNLOCK</button>
    </form>
    <p id="loginError" class="error" role="alert"></p>
  </section>

  <section id="inbox" hidden>
    <form id="filters" class="panel filters" aria-label="Filters">
      <label>STATUS <select id="fStatus"><option value="active">Inbox (new + read)</option><option value="new">New</option><option value="read">Read</option><option value="archived">Archived</option><option value="all">All</option></select></label>
      <label>CATEGORY <select id="fCategory"><option value="all">All</option><option value="bug">Bug</option><option value="balance">Balance</option><option value="idea">Idea</option><option value="other">Other</option></select></label>
      <label>SOURCE <select id="fSource"><option value="all">All</option><option value="live">Live game</option><option value="dev">/dev/ build</option><option value="unknown">Unknown</option></select></label>
      <label>RATING <select id="fRating"><option value="all">All</option><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option><option value="none">No rating</option></select></label>
      <div class="filter-actions"><button id="refresh" type="button">REFRESH</button><button id="csv" type="button">EXPORT CSV</button></div>
    </form>
    <p id="status" class="status" role="status"></p>
    <ol id="list" class="list"></ol>
    <button id="more" type="button" class="more" hidden>LOAD MORE</button>
  </section>
</main>
<script type="module" src="inbox.js"></script>
</body>
</html>
