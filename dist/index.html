<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Silkscreen:wght@400;700&display=swap');
:root{--cyan:#2cfaff;--pink:#ff3bd4;--purple:#7b4dff;--ink:#05060d;--glass:rgba(9,12,27,.78)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#e8ffff;font-family:'Share Tech Mono',monospace}body{touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}

#overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(46,16,77,.5),rgba(2,3,9,.94));padding:24px}.panel{width:min(650px,100%);text-align:center}.logo{font-family:Silkscreen;font-size:clamp(34px,8vw,76px);line-height:.92;margin:0;color:#fff;text-shadow:4px 4px 0 #7045ff,-4px -3px 0 #ff3bd4,0 0 28px #00eaff}.logo span{display:block;color:var(--cyan)}.kicker{letter-spacing:.38em;color:#ff72db;margin:22px 0 34px;font-size:13px}.start{pointer-events:auto;border:1px solid var(--cyan);background:rgba(0,246,255,.08);color:#fff;font:700 15px Silkscreen;padding:17px 30px;box-shadow:0 0 20px rgba(44,250,255,.2),inset 0 0 20px rgba(44,250,255,.08);cursor:pointer;transition:.2s}.start:hover{background:var(--cyan);color:#061018;box-shadow:0 0 38px var(--cyan);transform:translateY(-2px)}.tip{color:#8995ae;margin-top:28px;font-size:13px}.hidden{display:none!important}
#levelup{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(3,4,12,.88);backdrop-filter:blur(5px);padding:20px}#levelup.show{display:grid}.upgrade-wrap{width:min(920px,100%)}.upgrade-wrap h2{text-align:center;font-family:Silkscreen;color:var(--cyan);font-size:clamp(22px,5vw,42px);text-shadow:0 0 20px var(--cyan)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{pointer-events:auto;text-align:left;min-height:180px;padding:20px;background:linear-gradient(145deg,rgba(23,18,53,.96),rgba(7,13,26,.96));border:1px solid #5e56a1;color:white;cursor:pointer;transition:.18s;box-shadow:0 12px 50px #000}.card:hover{transform:translateY(-7px);border-color:var(--pink);box-shadow:0 0 26px rgba(255,59,212,.25)}.card b{font-family:Silkscreen;color:var(--pink);font-size:15px}.card i{display:block;font-style:normal;font-size:34px;margin:12px 0}.card p{color:#aebcd5;line-height:1.45;margin:0}
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);z-index:15;font-family:Silkscreen;color:#fff;text-shadow:0 0 14px var(--cyan);font-size:clamp(16px,3vw,28px);opacity:0;pointer-events:none}.flash{animation:toast 1.5s}@keyframes toast{0%{opacity:0;transform:translate(-50%,15px) scale(.8)}20%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}#mute{position:fixed;z-index:40;right:18px;top:76px;pointer-events:auto;background:#090d1caa;border:1px solid #52617c;color:#c7d6ec;padding:7px 10px;cursor:pointer}
@media(max-width:680px){#hud{padding:12px}.bars{left:12px;bottom:12px;width:55vw}.controls{display:none}.cards{grid-template-columns:1fr}.card{min-height:0}.stats{font-size:12px}.brand small{display:none}#mute{right:10px;top:58px}.kicker{letter-spacing:.18em}.panel{margin-top:-8vh}}
</style></head><body>
<canvas id="game"></canvas><div class="vignette"></div><div class="scan"></div>
<div id="hud"><div class="top"><div class="brand">NEON CRYPT<small>DESCENT PROTOCOL</small></div><div class="stats"><div>SECTOR <span id="wave">01</span></div><div>SCORE <span id="score">000000</span></div><div>HOSTILES <span id="enemies">0</span></div></div></div><div class="bars"><div class="label"><span>INTEGRITY</span><span id="hpText">100 / 100</span></div><div class="bar"><div class="fill" id="hpFill"></div></div><div class="label"><span>VOID CHARGE · LV <span id="lvl">1</span></span><span id="xpText">0 / 8</span></div><div class="bar"><div class="fill" id="xpFill"></div></div></div><div class="controls"><span class="key">WASD</span> MOVE · <span class="key">MOUSE</span> AIM<br><span class="key">SPACE</span> PHASE DASH · AUTO-FIRE</div></div>
<button id="mute" aria-label="Toggle music">♫ ON</button><div id="toast"></div>
<div id="overlay"><div class="panel"><h1 class="logo">NEON<span>CRYPT</span></h1><div class="kicker">A VOXEL DESCENT RITUAL</div><button class="start" id="start">ENTER THE CRYPT</button><div class="tip">Survive the swarm · harvest shards · evolve your rig<br>WASD / ARROWS or drag to move</div></div></div>
<div id="levelup"><div class="upgrade-wrap"><h2>CHOOSE AN EVOLUTION</h2><div class="cards" id="cards"></div></div></div>
<script>
const C=document.querySelector('#game'),X=C.getContext('2d'),$=s=>document.querySelector(s);let W,H,D=1,playing=false,paused=false,t=0,last=0,shake=0,flash=0;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let keys={},pointer={x:0,y:0,down:false,sx:0,sy:0};
let P,bullets=[],enemies=[],parts=[],gems=[],blocks=[],wave=1,score=0,spawnClock=0,kills=0;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();dash()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
C.addEventListener('pointerdown',e=>{pointer.down=true;pointer.sx=pointer.x=e.clientX;pointer.sy=pointer.y=e.clientY});C.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY});addEventListener('pointerup',()=>pointer.down=false);
const iso=(x,y,z=0)=>({x:W/2+(x-y)*.72,y:H*.48+(x+y)*.36-z});
function poly(p,fill,stroke){X.beginPath();X.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)X.lineTo(p[i].x,p[i].y);X.closePath();X.fillStyle=fill;X.fill();if(stroke){X.strokeStyle=stroke;X.stroke()}}
function cube(x,y,z,s,col,glow=0){let a=iso(x-s,y-s,z),b=iso(x+s,y-s,z),c=iso(x+s,y+s,z),d=iso(x-s,y+s,z),az=iso(x-s,y-s,z+s*1.7),bz=iso(x+s,y-s,z+s*1.7),cz=iso(x+s,y+s,z+s*1.7),dz=iso(x-s,y+s,z+s*1.7);X.save();if(glow){X.shadowBlur=glow;X.shadowColor=col}poly([az,bz,cz,dz],col);poly([b,c,cz,bz],shade(col,.48));poly([c,d,dz,cz],shade(col,.7));X.restore()}
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return `rgb(${r*k},${g*k},${b*k})`}
function reset(){P={x:0,y:0,hp:100,max:100,speed:150,level:1,xp:0,next:8,fire:.34,fireT:0,dmg:16,shots:1,pierce:0,dash:0,inv:0,magnet:120};bullets=[];enemies=[];parts=[];gems=[];blocks=[];wave=1;score=0;spawnClock=0;kills=0;for(let i=0;i<38;i++){let a=rnd(0,Math.PI*2),r=rnd(260,720);blocks.push({x:Math.cos(a)*r,y:Math.sin(a)*r,s:rnd(9,25),h:rnd(8,42),c:Math.random()<.5?'#151b48':'#241442'})}updateHUD()}
function start(){reset();playing=true;paused=false;$('#overlay').classList.add('hidden');audioStart();toast('SECTOR 01');last=performance.now();requestAnimationFrame(loop)}$('#start').onclick=start;
function dash(){if(!playing||paused||P.dash>0)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(!dx&&!dy){dx=1;dy=0}let l=Math.hypot(dx,dy);P.x+=dx/l*105;P.y+=dy/l*105;P.dash=1.25;P.inv=.3;burst(P.x,P.y,'#2cfaff',28,2);shake=10;sfx('dash')}
function spawn(){let a=rnd(0,Math.PI*2),r=rnd(480,650),type=Math.random()<Math.min(.12+wave*.025,.4)?1:0;enemies.push({x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,hp:type?48+wave*8:28+wave*5,max:type?48+wave*8:28+wave*5,s:type?18:12,spd:(type?34:52)+wave*2,type,hit:0})}
function shoot(){if(!enemies.length)return;let es=[...enemies].sort((a,b)=>dist(P,a)-dist(P,b)),e=es[0],ang=Math.atan2(e.y-P.y,e.x-P.x);for(let i=0;i<P.shots;i++){let aa=ang+(i-(P.shots-1)/2)*.14;bullets.push({x:P.x,y:P.y,vx:Math.cos(aa)*430,vy:Math.sin(aa)*430,life:1.5,d:P.dmg,p:P.pierce})}burst(P.x+Math.cos(ang)*15,P.y+Math.sin(ang)*15,'#ff3bd4',5,.7);sfx('shot')}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function burst(x,y,c,n=12,pow=1){for(let i=0;i<n;i++){let a=rnd(0,6.28),s=rnd(30,150)*pow;parts.push({x,y,z:rnd(0,15),vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:rnd(20,100)*pow,life:rnd(.3,.8),max:1,c,size:rnd(2,5)})}}
function update(dt){t+=dt;P.dash=Math.max(0,P.dash-dt);P.inv=Math.max(0,P.inv-dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer.down){dx=clamp((pointer.x-pointer.sx)/45,-1,1);dy=clamp((pointer.y-pointer.sy)/45,-1,1)}let l=Math.hypot(dx,dy)||1;P.x+=dx/l*P.speed*dt;P.y+=dy/l*P.speed*dt;
P.fireT-=dt;if(P.fireT<=0){shoot();P.fireT=P.fire}spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=Math.max(.16,.85-wave*.045)}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(e.hp>0&&dist(b,e)<e.s+5){e.hp-=b.d;e.hit=.1;b.p--;burst(b.x,b.y,'#ff55dd',4,.35);if(b.p<0)b.life=0;if(e.hp<=0){score+=typeScore(e);kills++;gems.push({x:e.x,y:e.y,v:1+e.type,z:12});burst(e.x,e.y,e.type?'#ff4e81':'#9c59ff',e.type?28:16,e.type?1.4:1);shake=e.type?12:4;sfx('kill');if(kills%16===0){wave++;toast('SECTOR '+String(wave).padStart(2,'0'));sfx('wave')}}break}}}
bullets=bullets.filter(b=>b.life>0);for(let e of enemies){e.hit=Math.max(0,e.hit-dt);let a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;if(dist(P,e)<e.s+12&&P.inv<=0){P.hp-=e.type?18:10;P.inv=.7;shake=15;flash=.15;burst(P.x,P.y,'#ff315f',20,1);sfx('hurt');if(P.hp<=0)gameOver()}}enemies=enemies.filter(e=>e.hp>0&&dist(P,e)<1100);
for(let g of gems){let d=dist(P,g);if(d<P.magnet){let a=Math.atan2(P.y-g.y,P.x-g.x),sp=80+(P.magnet-d)*4;g.x+=Math.cos(a)*sp*dt;g.y+=Math.sin(a)*sp*dt}g.z=10+Math.sin(t*5+g.x)*5;if(d<18){P.xp+=g.v;g.dead=true;sfx('gem');if(P.xp>=P.next)levelUp()}}gems=gems.filter(g=>!g.dead);
for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=180*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);updateHUD()}
function typeScore(e){return e.type?250:100}function levelUp(){P.xp-=P.next;P.level++;P.next=Math.floor(P.next*1.34+3);paused=true;renderUpgrades();$('#levelup').classList.add('show');sfx('level')}
const upgrades=[['PLASMA FORK','✦','Add one projectile',()=>P.shots=Math.min(5,P.shots+1)],['OVERCLOCK','⌁','Fire 14% faster',()=>P.fire*=.86],['VOID CORE','◆','Increase damage by 8',()=>P.dmg+=8],['PHASE ARMOR','⬡','Restore 35 integrity and +10 max',()=>{P.max+=10;P.hp=Math.min(P.max,P.hp+35)}],['GRAVITY WELL','◎','Expand shard collection field',()=>P.magnet+=65],['GHOST ROUND','→','Projectiles pierce +1 target',()=>P.pierce++],['RUSH CIRCUIT','ϟ','Move 12% faster',()=>P.speed*=1.12]];
function renderUpgrades(){let picks=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);$('#cards').innerHTML='';picks.forEach(u=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<b>${u[0]}</b><i>${u[1]}</i><p>${u[2]}</p>`;b.onclick=()=>{u[3]();paused=false;$('#levelup').classList.remove('show');toast(u[0]);last=performance.now()};$('#cards').appendChild(b)})}
function gameOver(){playing=false;setTimeout(()=>{$('#overlay').classList.remove('hidden');$('.logo').innerHTML='RUN<span>SEVERED</span>';$('.kicker').textContent=`SCORE ${String(score).padStart(6,'0')} · REACHED SECTOR ${wave}`;$('#start').textContent='RE-ENTER THE CRYPT'},400)}
function updateHUD(){$('#wave').textContent=String(wave).padStart(2,'0');$('#score').textContent=String(score).padStart(6,'0');$('#enemies').textContent=enemies.length;$('#hpText').textContent=`${Math.ceil(P?.hp||100)} / ${P?.max||100}`;$('#hpFill').style.width=((P?.hp||100)/(P?.max||100)*100)+'%';$('#lvl').textContent=P?.level||1;$('#xpText').textContent=`${P?.xp||0} / ${P?.next||8}`;$('#xpFill').style.width=((P?.xp||0)/(P?.next||8)*100)+'%'}function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}
function grid(){X.strokeStyle='rgba(49,54,116,.22)';X.lineWidth=1;let size=48,range=14,ox=((P?.x||0)%size),oy=((P?.y||0)%size);for(let i=-range;i<=range;i++){let a=iso(i*size-ox,-range*size-oy),b=iso(i*size-ox,range*size-oy);X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke();a=iso(-range*size-ox,i*size-oy);b=iso(range*size-ox,i*size-oy);X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}}
function draw(){let sx=rnd(-shake,shake),sy=rnd(-shake,shake);shake*=.86;X.save();X.translate(sx,sy);let g=X.createRadialGradient(W*.5,H*.45,20,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,'#161038');g.addColorStop(.52,'#080b1b');g.addColorStop(1,'#03040a');X.fillStyle=g;X.fillRect(-20,-20,W+40,H+40);grid();X.save();X.translate(W/2-iso(P?.x||0,P?.y||0).x,H*.48-iso(P?.x||0,P?.y||0).y);
let drawables=[];for(let b of blocks)drawables.push({y:b.x+b.y,f:()=>cube(b.x,b.y,0,b.s,b.c)});for(let g of gems)drawables.push({y:g.x+g.y,f:()=>{let q=iso(g.x,g.y,g.z);X.save();X.shadowBlur=20;X.shadowColor='#2cfaff';X.fillStyle='#92ffff';X.translate(q.x,q.y);X.rotate(t*2);X.fillRect(-4,-4,8,8);X.restore()}});for(let e of enemies)drawables.push({y:e.x+e.y,f:()=>{cube(e.x,e.y,0,e.s,e.hit?'#ffffff':e.type?'#ff315f':'#824cff',e.type?18:8);let q=iso(e.x,e.y,e.s*1.2);X.fillStyle='#05060d';X.fillRect(q.x-5,q.y-3,3,3);X.fillRect(q.x+2,q.y-3,3,3)}});if(P)drawables.push({y:P.x+P.y,f:()=>{let pulse=8+Math.sin(t*7)*2;X.save();let q=iso(P.x,P.y,0);X.strokeStyle='rgba(44,250,255,.45)';X.lineWidth=2;X.beginPath();X.ellipse(q.x,q.y+7,22+pulse,11+pulse/2,0,0,6.28);X.stroke();X.restore();cube(P.x,P.y,0,13,P.inv>0?'#ffffff':'#2cfaff',20);cube(P.x,P.y,20,7,'#ff3bd4',14)}});drawables.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
for(let b of bullets){let q=iso(b.x,b.y,10);X.save();X.shadowBlur=18;X.shadowColor='#ff3bd4';X.fillStyle='#fff';X.fillRect(q.x-4,q.y-4,8,8);X.restore()}for(let p of parts){let q=iso(p.x,p.y,Math.max(0,p.z));X.globalAlpha=Math.max(0,p.life/.8);X.fillStyle=p.c;X.fillRect(q.x-p.size/2,q.y-p.size/2,p.size,p.size)}X.globalAlpha=1;X.restore();if(flash>0){X.fillStyle=`rgba(255,30,90,${flash})`;X.fillRect(0,0,W,H);flash-=.02}X.restore()}
function loop(now){let dt=Math.min((now-last)/1000,.033);last=now;if(playing){if(!paused)update(dt);draw();requestAnimationFrame(loop)}}
let AC,master,muted=false,beat=0,nextBeat=0;function audioStart(){if(AC)return;AC=new (AudioContext||webkitAudioContext)();master=AC.createGain();master.gain.value=.16;master.connect(AC.destination);nextBeat=AC.currentTime;musicTick()}
function tone(freq,time,dur,type='square',vol=.12){if(!AC||muted)return;let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(vol,time);g.gain.exponentialRampToValueAtTime(.001,time+dur);o.connect(g);g.connect(master);o.start(time);o.stop(time+dur)}
function musicTick(){if(!AC)return;while(nextBeat<AC.currentTime+.12){let bass=[55,55,65.41,49][Math.floor(beat/4)%4],step=[1,1.5,2,1.5][beat%4];tone(bass*step,nextBeat,.18,'sawtooth',.14);if(beat%2===0)tone(880,nextBeat,.035,'square',.05);if(beat%8===6)tone(bass*8,nextBeat,.3,'triangle',.04);beat++;nextBeat+=.14}setTimeout(musicTick,50)}
function sfx(k){if(!AC||muted)return;let n=AC.currentTime;if(k==='shot')tone(rnd(180,240),n,.05,'square',.035);if(k==='kill')tone(100,n,.12,'sawtooth',.08);if(k==='gem')tone(700+rnd(0,200),n,.06,'sine',.05);if(k==='hurt')tone(65,n,.22,'sawtooth',.14);if(k==='dash'){tone(130,n,.18,'sawtooth',.12);tone(260,n+.04,.14,'square',.06)}if(k==='level'){[330,440,660,880].forEach((f,i)=>tone(f,n+i*.08,.25,'square',.08))}if(k==='wave'){[110,165,220].forEach((f,i)=>tone(f,n+i*.12,.3,'sawtooth',.08))}}
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'♫ OFF':'♫ ON';if(AC)master.gain.value=muted?0:.16};
// ambient title animation
P={x:0,y:0};for(let i=0;i<32;i++){let a=rnd(0,6.28),r=rnd(200,700);blocks.push({x:Math.cos(a)*r,y:Math.sin(a)*r,s:rnd(10,25),h:20,c:Math.random()<.5?'#151b48':'#241442'})}(function idle(n){if(!playing){t+=.012;P.x=Math.sin(t*.2)*20;P.y=Math.cos(t*.17)*20;draw();requestAnimationFrame(idle)}})(0);
</script></body></html>
