# One-off and READ-ONLY here: reads the state of Cloudflare Web Analytics for riftborn.us (which mechanism
# injects the visit-counting beacon, the zone and Workers plans, what the deploy token may do, whether Workers
# Logs can hold client IPs) with scripts/cloudflare-web-analytics.mjs inspect, and prints derived facts only as
# annotations (this is a public repository: no token, id, tag or snippet is ever printed). It changes nothing.
# Tasks 3.4 and 3.5 of the player-metrics plan extend it with `apply` and `verify`, started from the Actions
# page; Task 6.9 Step 2 removes it. It runs when a push to main touches THIS file; to run it again, push a
# change to this file or use "Re-run all jobs" on the run page.
name: Cloudflare Web Analytics check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-web-analytics.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-web-analytics
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-web-analytics.mjs inspect
