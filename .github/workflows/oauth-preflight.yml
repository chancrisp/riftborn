# One-off: check the sign-in secrets were pasted correctly (never prints them).
# Each check is its own step so the pass/fail per platform is visible without logs.
name: Sign-in secrets check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oauth-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
      GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AUTH_SIGNING_KEY: ${{ secrets.AUTH_SIGNING_KEY }}
    steps:
      - name: Signing key
        if: always()
        run: |
          node -e '
          const k = process.env.AUTH_SIGNING_KEY || "";
          if (!k) { console.log("missing"); process.exit(1); }
          if (k !== k.trim()) { console.log("has leading/trailing spaces"); process.exit(1); }
          if (k.length < 32) { console.log("too short: " + k.length); process.exit(1); }
          console.log("ok, length " + k.length);'
      - name: Discord
        if: always()
        run: |
          node -e '
          const id = process.env.DISCORD_CLIENT_ID || "", secret = process.env.DISCORD_CLIENT_SECRET || "";
          if (!id || !secret) { console.log("missing"); process.exit(1); }
          if (id !== id.trim() || secret !== secret.trim()) { console.log("spaces around a value"); process.exit(1); }
          if (!/^\d{17,20}$/.test(id)) { console.log("client id is not a Discord id"); process.exit(1); }
          fetch("https://discord.com/api/v10/oauth2/token", { method: "POST",
            headers: { Authorization: "Basic " + Buffer.from(id + ":" + secret).toString("base64"), "Content-Type": "application/x-www-form-urlencoded" },
            body: "grant_type=client_credentials&scope=identify" })
            .then(async (r) => { const j = await r.json().catch(() => ({})); console.log("status " + r.status + " " + (j.error || "ok")); process.exit(r.ok ? 0 : 1); });'
      - name: GitHub
        if: always()
        run: |
          node -e '
          const id = process.env.GH_CLIENT_ID || "", secret = process.env.GH_CLIENT_SECRET || "";
          if (!id || !secret) { console.log("missing"); process.exit(1); }
          if (id !== id.trim() || secret !== secret.trim()) { console.log("spaces around a value"); process.exit(1); }
          fetch("https://api.github.com/applications/" + encodeURIComponent(id) + "/token", { method: "POST",
            headers: { Authorization: "Basic " + Buffer.from(id + ":" + secret).toString("base64"), Accept: "application/vnd.github+json", "User-Agent": "riftborn-preflight", "Content-Type": "application/json" },
            body: JSON.stringify({ access_token: "gho_" + "0".repeat(36) }) })
            .then((r) => { console.log("status " + r.status); process.exit(r.status === 404 || r.status === 422 ? 0 : 1); });'
      - name: Google
        if: always()
        run: |
          node -e '
          const id = process.env.GOOGLE_CLIENT_ID || "", secret = process.env.GOOGLE_CLIENT_SECRET || "";
          if (!id || !secret) { console.log("missing"); process.exit(1); }
          if (id !== id.trim() || secret !== secret.trim()) { console.log("spaces around a value"); process.exit(1); }
          if (!id.endsWith(".apps.googleusercontent.com")) { console.log("client id format"); process.exit(1); }
          const body = new URLSearchParams({ client_id: id, client_secret: secret, code: "preflight-invalid-code", grant_type: "authorization_code", redirect_uri: "https://api.riftborn.us/auth/google/callback" });
          fetch("https://oauth2.googleapis.com/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body })
            .then(async (r) => { const j = await r.json().catch(() => ({})); console.log("status " + r.status + " " + (j.error || "")); process.exit(j.error === "invalid_grant" ? 0 : 1); });'
