name: Deploy Riftborn leaderboard Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check deployment settings
        env:
          RIFTBORN_SITE_ORIGIN: ${{ vars.RIFTBORN_SITE_ORIGIN }}
        run: |
          if [ -z "$RIFTBORN_SITE_ORIGIN" ]; then
            echo "Set the repository variable RIFTBORN_SITE_ORIGIN first." >&2
            exit 1
          fi
      - name: Materialize D1 binding
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/materialize-wrangler.mjs
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: deploy --config cloudflare/.wrangler.deployment.jsonc --var ALLOWED_ORIGINS:${{ vars.RIFTBORN_SITE_ORIGIN }}
