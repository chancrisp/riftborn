name: Deploy Riftborn leaderboard Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker.yml'
      - 'cloudflare/**'
      - 'server/scores-api.js'
      - 'server/feedback-api.js'
      - 'server/admin-auth.js'
      - 'server/accounts-api.js'
      - 'server/username-rules.js'
      - 'site.hosts.mjs'
      - 'scripts/cloudflare-worker-upload.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only main ever deploys api.riftborn.us (a manual run on another branch skips this job, and
    # scripts/cloudflare-worker-upload.mjs refuses any other ref in CI as well).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy Worker through the Cloudflare Script Upload API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          # Optional extra CORS origins (one or a comma list): https://riftborn.us, https://dev.riftborn.us
          # and https://chancrisp.github.io are always allowed (site.hosts.mjs).
          RIFTBORN_SITE_ORIGIN: ${{ vars.RIFTBORN_SITE_ORIGIN }}
          # Optional: the feedback inbox key and a Discord webhook for new-feedback pings.
          # Secrets are copied into the Worker only when it deploys: after changing one, redeploy with
          # Actions > Deploy Riftborn leaderboard Worker > Run workflow (or push a change to a path above).
          FEEDBACK_ADMIN_KEY: ${{ secrets.FEEDBACK_ADMIN_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # FEEDBACK_KEY_STRICT (repository variable, 1 once the admin key is 24+ random characters):
          # a shorter FEEDBACK_ADMIN_KEY then fails the deploy instead of only warning.
          FEEDBACK_KEY_STRICT: ${{ vars.FEEDBACK_KEY_STRICT }}
          # Optional (Riftborn accounts, v2.2): OAuth app credentials per platform and the HMAC
          # signing key (32+ random bytes). A platform missing its ID or secret stays unavailable.
          # GitHub forbids secret names starting with GITHUB_, hence GH_CLIENT_* for the GitHub app.
          # AUTH_SIGNING_KEY_PREVIOUS: only after a key rotation (the old key, kept for lookups).
          # ACCOUNTS_LIVE (repository variable, 1 once players have accounts): a deploy without
          # AUTH_SIGNING_KEY then fails instead of switching accounts off.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          AUTH_SIGNING_KEY: ${{ secrets.AUTH_SIGNING_KEY }}
          AUTH_SIGNING_KEY_PREVIOUS: ${{ secrets.AUTH_SIGNING_KEY_PREVIOUS }}
          ACCOUNTS_LIVE: ${{ vars.ACCOUNTS_LIVE }}
        run: node scripts/cloudflare-worker-upload.mjs
