name: Deploy Riftborn preview links

# Preview links (scripts/pages-previews.mjs): every previews/<name>/ folder, staged by the source
# repo's .tools/deploy-preview.mjs, is a password-gated test build. It is published as a branch
# deployment of the Cloudflare Pages project "riftborn-dev" at
#   https://<name>.riftborn-dev.pages.dev/
# next to dev.riftborn.us (that project's production branch), never in its place. <name> starts with
# the version of the build in the folder (v2-4-0, or v2-4-0-<tag>); a folder whose name does not match
# its build's version is refused. A preview whose folder was removed has its deployments deleted, so
# its link stops working.
# Never touches riftborn.us, dev.riftborn.us or github.io: pages.yml ignores pushes that only change
# previews/, and the deploy refuses the production branch. Same token and environment as pages.yml
# (CLOUDFLARE_API_TOKEN with Cloudflare Pages: Edit), only on main.

on:
  push:
    branches: [main]
    paths:
      - 'previews/**'
      - '.github/workflows/previews.yml'
      - 'scripts/pages-previews.mjs'
      - 'scripts/pages-headers.mjs'
      - 'scripts/pages-templates.mjs'
      - 'scripts/cloudflare-pages-deploy.mjs'
      - 'scripts/cloudflare-pages-verify.mjs'
      # Hosts, project names and the production branch the scripts above import.
      - 'site.config.mjs'
      - 'site.hosts.mjs'
  workflow_dispatch:
    inputs:
      redeploy:
        description: Redeploy every preview, even one already served as staged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-previews
  cancel-in-progress: false

jobs:
  previews:
    # Only main (a manual run on another branch skips this job, and the deploy script refuses any
    # other ref in CI as well), and only while Cloudflare Pages is on.
    if: vars.CF_PAGES_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/wrangler/package-lock.json
      # Wrangler runs with the production token: exact-pinned by the tools/wrangler lockfile, never
      # fetched at deploy time, no install scripts.
      - name: Install the pinned Wrangler
        run: npm ci --prefix tools/wrangler --ignore-scripts --no-audit --no-fund
      - name: Check and stage the previews
        run: node scripts/pages-previews.mjs
      - name: Deploy the preview links and remove stale ones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          PREVIEW_REDEPLOY: ${{ inputs.redeploy && '1' || '' }}
        run: node scripts/cloudflare-pages-deploy.mjs --previews
      - name: Check the preview links serve their builds
        run: node scripts/cloudflare-pages-verify.mjs --previews
