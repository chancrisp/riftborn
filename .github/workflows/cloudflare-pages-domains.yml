# One-off: connect riftborn.us and dev.riftborn.us to the Cloudflare Pages projects.
# Each action is its own step so pass/fail is visible without logs. Removed after it runs.
name: Cloudflare Pages domains

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-pages-domains.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domains:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Write helper
        run: |
          cat > cf.mjs <<'EOF'
          const acct = process.env.CLOUDFLARE_ACCOUNT_ID;
          export const api = async (method, path, body) => {
            const r = await fetch('https://api.cloudflare.com/client/v4' + path, { method,
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined });
            const j = await r.json().catch(() => ({}));
            console.log(method, path.replace(acct, '<account>'), r.status, j.success, JSON.stringify((j.errors || []).map((e) => [e.code, e.message])));
            return j;
          };
          export const zoneId = async () => (await api('GET', '/zones?name=riftborn.us')).result?.[0]?.id;
          export const addDomain = async (project, name) => {
            const j = await api('POST', `/accounts/${acct}/pages/projects/${project}/domains`, { name });
            const ok = j.success || (j.errors || []).some((e) => /already/i.test(e.message || ''));
            if (!ok) process.exit(1);
          };
          export const cname = async (name, target) => {
            const zone = await zoneId(); if (!zone) process.exit(1);
            const existing = await api('GET', `/zones/${zone}/dns_records?name=${name}`);
            const recs = existing.result || [];
            if (recs.some((r) => r.type === 'CNAME' && r.content === target)) return;
            if (recs.length) { console.log('conflicting records exist:', recs.map((r) => r.type).join(',')); process.exit(1); }
            const j = await api('POST', `/zones/${zone}/dns_records`, { type: 'CNAME', name, content: target, proxied: true, comment: 'Riftborn Cloudflare Pages' });
            if (!j.success) process.exit(1);
          };
          EOF
      - name: Pages domain riftborn.us
        if: always()
        run: node --input-type=module -e "import { addDomain } from './cf.mjs'; await addDomain('riftborn', 'riftborn.us');"
      - name: Pages domain dev.riftborn.us
        if: always()
        run: node --input-type=module -e "import { addDomain } from './cf.mjs'; await addDomain('riftborn-dev', 'dev.riftborn.us');"
      - name: DNS riftborn.us
        if: always()
        run: node --input-type=module -e "import { cname } from './cf.mjs'; await cname('riftborn.us', 'riftborn.pages.dev');"
      - name: DNS dev.riftborn.us
        if: always()
        run: node --input-type=module -e "import { cname } from './cf.mjs'; await cname('dev.riftborn.us', 'riftborn-dev.pages.dev');"
